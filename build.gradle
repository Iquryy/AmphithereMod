buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { name = 'sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath group: 'org.parchmentmc', name: 'librarian', version: '1.+', changing: true
    }
}

plugins {
    id 'eclipse'
    id 'idea'
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'org.parchmentmc.librarian.forgegradle'

version = "${mc_version}-${mod_version}"
group = 'amphitheremod'
base { archivesName = 'amphitheremod' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${mc_version}"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mixins against Ice and Fire and vanilla need the SRG->MCP refmap remapped in the dev environment
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                amphitheremod { source sourceSets.main }
            }
        }
        client { workingDirectory project.file('run/client') }
        server { workingDirectory project.file('run/server') }
    }
}

repositories {
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    // Optional: drop an Ice and Fire jar at libs/iceandfire-1.jar to build and run against it instead of the
    // CurseForge release (used to test against Ice and Fire forks)
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    // Ice and Fire is the mod this add-on extends; Citadel is its model/animation library
    if (file('libs/iceandfire-1.jar').exists()) {
        implementation fg.deobf('local:iceandfire:1')
    } else {
        implementation fg.deobf('curse.maven:ice-and-fire-dragons-264231:5633453')
    }
    implementation fg.deobf('curse.maven:citadel-331936:5075402')

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'amphitheremod.refmap.json'
    config 'amphitheremod.mixins.json'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'amphitheremod',
                'Specification-Vendor'    : 'Iqury',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Iqury',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'amphitheremod.mixins.json'
        ])
    }
}
jar.finalizedBy('reobfJar')

processResources {
    inputs.property 'version', mod_version
    filesMatching('META-INF/mods.toml') { expand 'version': mod_version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
